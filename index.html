<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TraceCoin 功能导航</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: linear-gradient(120deg, #eef2ff, #f8fafc); min-height: 100vh; }
    .wrap { max-width: 1040px; margin: 48px auto; }
    .card { border: 0; border-radius: 16px; box-shadow: 0 10px 24px rgba(0,0,0,.08); }
    .btn-lg { min-width: 220px; }
  </style>
</head>
<body>
  <div class="container wrap">
    <div class="text-center mb-4">
      <h2>TraceCoin 虚拟货币溯源与存证系统</h2>
      <p class="text-muted">分析页已整合追踪、聚类、时序、画像等子功能</p>
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card p-4 h-100">
          <h5>交易溯源分析</h5>
          <p class="text-muted mb-4">地址查询、风险评估、关系图谱。点击图谱中的对手地址可直接触发该地址分析。</p>
          <a class="btn btn-primary btn-lg" href="/page/analyze">进入分析页</a>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-4 h-100">
          <h5>批量分析</h5>
          <p class="text-muted mb-4">多地址并行查询，共同对手地址自动提取并支持一键复制。</p>
          <a class="btn btn-success btn-lg" href="/page/batch">进入批量页</a>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-4 h-100">
          <h5>PDF 报告与链上存证</h5>
          <p class="text-muted mb-4">生成分析报告、计算 Hash、上链存证、历史查询与验真。</p>
          <a class="btn btn-dark btn-lg" href="/page/evidence">进入存证页</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
