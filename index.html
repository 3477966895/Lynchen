<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TraceCoin 虚拟货币溯源与存证系统</title>
<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<style>
body{margin:0;padding:20px;background:#f4f6fb;font-family:"Microsoft YaHei",sans-serif;color:#1e293b}
.card{max-width:1140px;margin:0 auto 16px;background:#fff;border:1px solid #dbe2f0;border-radius:12px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input,select{padding:10px;border:1px solid #cfd7e8;border-radius:8px}
button{padding:10px 14px;border:0;border-radius:8px;background:#0b5fff;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#475569}
#chart{height:460px;border:1px solid #e1e7f4;border-radius:8px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #dbe2f0;padding:6px;word-break:break-all}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.low{background:#dcfce7;color:#14532d}.medium{background:#ffedd5;color:#9a3412}.high{background:#fee2e2;color:#991b1b}
.muted{color:#64748b;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <h2>TraceCoin 虚拟货币溯源与存证系统</h2>
  <p class="muted">支持交易图谱分析、风险预警、地址聚类、链上存证与报告验真。</p>
  <div class="row">
    <input id="addr" style="flex:1;min-width:320px" value="0xde0B295669a9FD93d5F28D9Ec85E40f4cb697BAe" />
    <select id="limit"><option>30</option><option selected>50</option><option>80</option></select>
    <button onclick="analyze()">开始分析</button>
    <button class="secondary" onclick="runClusterOnly()">仅刷新聚类</button>
    <button onclick="storeReport()">生成PDF并存证</button>
    <button onclick="loadHistory()">加载历史</button>
  </div>
  <p>风险等级：<span id="level" class="badge low">LOW</span> 分数：<b id="score">0</b></p>
  <p id="alerts">预警：暂无</p>
  <div id="chart"></div>

  <h3>地址聚类分析</h3>
  <p id="clusterSummary" class="muted">聚类结果：尚未分析。</p>
  <table>
    <thead>
      <tr><th>簇ID</th><th>簇类型</th><th>地址数</th><th>交互次数</th><th>交互金额(ETH)</th><th>地址样本</th></tr>
    </thead>
    <tbody id="clusterTable"></tbody>
  </table>

  <h3>交易明细</h3>
  <table>
    <thead><tr><th>Hash</th><th>From</th><th>To</th><th>ETH</th></tr></thead>
    <tbody id="txs"></tbody>
  </table>
</div>

<div class="card">
  <h3>报告验真</h3>
  <div class="row">
    <input id="file" type="file" accept="application/pdf"/>
    <button onclick="verifyReport()">校验报告</button>
  </div>
  <p id="verifyResult"></p>
</div>

<div class="card">
  <h3>存证历史</h3>
  <table>
    <thead><tr><th>ID</th><th>Hash</th><th>风险</th><th>链上Tx</th><th>时间</th></tr></thead>
    <tbody id="history"></tbody>
  </table>
</div>

<script>
const API = "http://127.0.0.1:5000";
const CONTRACT_ADDRESS = "0xE9F17c1b00969664Cb88DA1B98D2f7a919d0D882";
const ABI = [
  "function storeEvidence(address _target, string _hash) public",
  "function getEvidences(address _target) public view returns (tuple(address target, string pdfHash, uint256 timestamp)[])"
];
let data = null;
let chart = null;

async function api(path, method="GET", body=null){
  const resp = await fetch(API + path, {
    method,
    headers: {"Content-Type":"application/json"},
    body: body ? JSON.stringify(body) : null
  });
  const json = await resp.json();
  if (!resp.ok) throw new Error(json.error || "请求失败");
  return json;
}

function short(x){ return x ? x.slice(0, 10) + "..." + x.slice(-6) : "-"; }

function setRisk(level, score){
  const e = document.getElementById("level");
  e.className = "badge " + level.toLowerCase();
  e.textContent = level;
  document.getElementById("score").textContent = score;
}

function renderCluster(clustering){
  const tbody = document.getElementById("clusterTable");
  if (!clustering || !clustering.clusters || !clustering.clusters.length){
    const tip = clustering && clustering.note ? clustering.note : "未形成有效簇。";
    document.getElementById("clusterSummary").textContent = "聚类结果：" + tip;
    tbody.innerHTML = '<tr><td colspan="6">暂无聚类数据</td></tr>';
    return;
  }
  document.getElementById("clusterSummary").textContent =
    `聚类结果：共 ${clustering.cluster_count} 个簇，覆盖 ${clustering.address_count} 个关联地址（方法：${clustering.method}）。`;
  tbody.innerHTML = clustering.clusters.map(c => `
    <tr>
      <td>${c.cluster_id}</td>
      <td>${c.label}</td>
      <td>${c.size}</td>
      <td>${c.interaction_count}</td>
      <td>${c.interaction_volume_eth}</td>
      <td>${c.members.slice(0,3).join("<br>")}${c.members.length>3?"<br>...":""}</td>
    </tr>
  `).join("");
}

function renderTxs(txs){
  const tbody = document.getElementById("txs");
  tbody.innerHTML = txs.map(t => `
    <tr><td>${short(t.hash)}</td><td>${t.from}</td><td>${t.to}</td><td>${t.value_eth}</td></tr>
  `).join("");
}

function renderGraph(graphData){
  if (!chart) chart = echarts.init(document.getElementById("chart"));
  chart.setOption({
    tooltip: {},
    series:[{
      type:"graph",
      layout:"force",
      roam:true,
      label:{show:true, fontSize:9},
      force:{repulsion:700, edgeLength:120},
      data: graphData.nodes,
      links: graphData.links
    }]
  });
}

async function analyze(){
  const address = document.getElementById("addr").value.trim();
  const limit = Number(document.getElementById("limit").value);
  data = await api("/api/analyze", "POST", {address, limit});
  setRisk(data.risk.level, data.risk.score);
  document.getElementById("alerts").textContent =
    "预警：" + (data.risk.alerts.length ? data.risk.alerts.join("；") : "暂无明显异常");
  renderGraph(data.graph);
  renderTxs(data.txs);
  renderCluster(data.clustering);
}

async function runClusterOnly(){
  const address = document.getElementById("addr").value.trim();
  const limit = Number(document.getElementById("limit").value);
  const clustering = await api("/api/cluster", "POST", {address, limit});
  renderCluster(clustering);
}

async function fileHash(blob){
  const b = await blob.arrayBuffer();
  const h = await crypto.subtle.digest("SHA-256", b);
  return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, "0")).join("");
}

async function storeOnChain(hash){
  if (!window.ethereum) throw new Error("未检测到 MetaMask");
  const provider = new ethers.BrowserProvider(window.ethereum);
  const signer = await provider.getSigner();
  const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
  const tx = await contract.storeEvidence(data.address, hash);
  await tx.wait();
  return tx.hash;
}

async function storeReport(){
  if (!data){ alert("请先完成地址分析"); return; }
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF();
  pdf.setFontSize(14); pdf.text("TraceCoin Report", 10, 12);
  pdf.setFontSize(10); pdf.text(`Address: ${data.address}`, 10, 20);
  pdf.text(`Risk: ${data.risk.level} (${data.risk.score})`, 10, 26);
  pdf.text(`Cluster count: ${data.clustering.cluster_count}`, 10, 32);
  const canvas = await html2canvas(document.getElementById("chart"));
  pdf.addImage(canvas.toDataURL("image/png"), "PNG", 10, 36, 190, 72);
  pdf.autoTable({
    startY: 112,
    head: [["Hash","From","To","ETH"]],
    body: data.txs.map(t => [short(t.hash), t.from, t.to, String(t.value_eth)]),
    styles: {fontSize: 7}
  });
  const blob = pdf.output("blob");
  const hash = await fileHash(blob);
  const chainTxHash = await storeOnChain(hash);
  await api("/api/evidence/register", "POST", {
    address: data.address,
    report_hash: hash,
    tx_count: data.tx_count,
    risk_score: data.risk.score,
    risk_level: data.risk.level,
    chain_tx_hash: chainTxHash,
    note: "frontend-generated-pdf-with-clustering"
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Report_${data.address.slice(0,8)}.pdf`;
  a.click();
  alert("存证成功，Hash: " + hash);
}

async function verifyReport(){
  const file = document.getElementById("file").files[0];
  const addr = document.getElementById("addr").value.trim();
  if (!file){ document.getElementById("verifyResult").textContent = "请先选择 PDF"; return; }
  const hash = await fileHash(file);
  const result = await api("/api/evidence/verify", "POST", {address: addr, report_hash: hash});
  document.getElementById("verifyResult").textContent = result.is_valid
    ? `校验通过，DB=${result.db_match}，CHAIN=${result.chain_match}`
    : "校验失败：无有效存证";
}

async function loadHistory(){
  const addr = document.getElementById("addr").value.trim();
  const result = await api(`/api/evidence/history/${addr}`);
  document.getElementById("history").innerHTML = result.history.map(x => `
    <tr><td>${x.id}</td><td>${short(x.report_hash)}</td><td>${x.risk_level} (${x.risk_score})</td><td>${x.chain_tx_hash || "-"}</td><td>${x.created_at}</td></tr>
  `).join("");
}
</script>
</body>
</html>
