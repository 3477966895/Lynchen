<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TraceCoin 批量查询</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f7fafc; padding: 16px; }
    .card { border: 0; border-radius: 14px; box-shadow: 0 8px 20px rgba(0,0,0,.06); }
    .mono { font-family: Consolas, Menlo, monospace; font-size: 12px; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">批量地址分析</h4>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-secondary" href="/">返回导航</a>
      <a class="btn btn-outline-primary" href="/page/analyze">去分析页</a>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <textarea id="batchAddresses" class="form-control" rows="4" placeholder="每行一个地址，最多 5 个"></textarea>
      <div class="mt-2 d-flex gap-2">
        <button id="batchBtn" class="btn btn-primary">批量查询</button>
        <button id="copyBtn" class="btn btn-secondary">复制共同对手地址</button>
      </div>
      <div id="summary" class="mt-2"></div>
      <div id="common" class="mt-1"></div>

      <div class="table-responsive mt-3">
        <table class="table table-sm table-bordered table-striped">
          <thead class="table-dark"><tr><th>来源地址</th><th>哈希</th><th>时间</th><th>对手地址</th><th>金额</th><th>资产</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let commonCounterparties = [];

function shortHash(h) { return h ? `${h.slice(0,10)}...${h.slice(-6)}` : "-"; }

async function api(url, method = "GET", body = null) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "请求失败");
  return data;
}

async function batchQuery() {
  const addresses = document.getElementById("batchAddresses").value.split(/[\n,]/).map(v => v.trim()).filter(Boolean);
  if (!addresses.length) return alert("请先输入地址");
  try {
    const data = await api("/api/batch", "POST", { addresses });
    commonCounterparties = data.common_counterparties || [];

    document.getElementById("summary").innerHTML = `<div class='alert alert-success'>完成：${data.transactions.length} 条交易</div>`;
    document.getElementById("common").innerHTML = `<b>共同对手地址：</b>${commonCounterparties.length ? commonCounterparties.join("；") : "无"}`;

    const tbody = document.getElementById("rows");
    tbody.innerHTML = "";
    data.transactions.forEach(tx => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td class='mono'>${tx.source_address}</td><td class='mono'>${shortHash(tx.hash)}</td><td>${tx.time_text || "-"}</td><td class='mono'>${tx.counterparty || "-"}</td><td>${tx.value_eth}</td><td>${tx.asset_symbol || "ETH"}</td>`;
      tbody.appendChild(tr);
    });
  } catch (e) {
    document.getElementById("summary").innerHTML = `<div class='alert alert-danger'>${e.message}</div>`;
  }
}

async function copyCommon() {
  if (!commonCounterparties.length) return alert("当前没有可复制的共同对手地址");
  await navigator.clipboard.writeText(commonCounterparties.join("\n"));
  alert("已复制到剪贴板");
}

document.getElementById("batchBtn").onclick = batchQuery;
document.getElementById("copyBtn").onclick = copyCommon;
</script>
</body>
</html>
